<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การพัฒนาตนเอง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#5B21B6', secondary: '#EC4899' } } } }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="page-shell">
        <div class="floating-shell">
            <aside class="sidebar">
                <div class="sidebar-inner">
                    <div class="brand">
                        <div class="brand-mark">P</div>
                        <div class="brand-text">Portfolio Teacher</div>
                    </div>

                    <div class="profile-box">
                        <img data-img="profile" src="../assets/images/profile.jpg" alt="profile">
                        <div>
                            <h3 data-field="fullname">นายณัฏฐชัย มาตา</h3>
                            <p data-field="position">ครูชำนาญการ</p>
                        </div>
                    </div>

                    <nav class="side-nav">
                        <a href="../index.html"><i class="fa fa-tachometer"></i> ภาพรวม</a>
                        <a href="awards.html"><i class="fa fa-trophy"></i> รางวัล</a>
                        <a href="documents.html"><i class="fa fa-file-text"></i> เอกสาร PA</a>
                        <a href="best-practice.html"><i class="fa fa-lightbulb-o"></i> แนวปฏิบัติ</a>
                        <a href="teaching.html"><i class="fa fa-book"></i> ผลงานสอน</a>
                        <a href="development.html" class="active"><i class="fa fa-graduation-cap"></i> พัฒนาตนเอง</a>
                        <a href="evaluation.html"><i class="fa fa-check-square-o"></i> ผลการประเมิน</a>
                        <a href="profile.html"><i class="fa fa-user"></i> ข้อมูลส่วนตัว</a>
                        <a href="admin.html"><i class="fa fa-cogs"></i> ตั้งค่าข้อมูล</a>
                    </nav>
                </div>
            </aside>

            <main class="main-panel">
                <section class="hero-panel" data-cover="hero">
                    <div class="hero-inner">
                        <div class="hero-copy">
                            <span class="eyebrow"><i class="fa fa-graduation-cap"></i> <span
                                    data-field="position_level">ครูชำนาญการพิเศษ</span></span>
                            <h1>การพัฒนาตนเอง</h1>
                            <p>การอบรม หลักสูตร และกิจกรรมที่เสริมทักษะเชิงวิชาชีพเพื่อพัฒนาการสอน</p>
                        </div>
                        <div class="hero-actions">
                            <div class="hero-badge">
                                <span>ปีการศึกษา</span>
                                <strong data-field="year">2569</strong>
                            </div>
                            <div class="theme-switcher">
                                <button class="theme-btn active" data-theme-btn="aurora" type="button">Aurora</button>
                                <button class="theme-btn" data-theme-btn="sunset" type="button">Sunset</button>
                                <button class="theme-btn" data-theme-btn="forest" type="button">Forest</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="detail-stack">
                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title">หลักสูตรและการพัฒนาตนเอง</div>
                        </div>
                        <div class="space-y-4" id="dev-list"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
    <script>
        function renderDev() {
            const list = document.getElementById('dev-list');
            if (!CONFIG.development) return;
            CONFIG.development.forEach(item => {
                list.innerHTML += `
          <div class="portfolio-card" style="border-radius:18px;">
            <div class="portfolio-body" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
              <div>
                <h3>${item.name}</h3>
                <p>${item.date} • จำนวน ${item.hours} ชั่วโมง</p>
              </div>
              <a href="${item.certificate}" target="_blank" class="inline-link">ดูวุฒิบัตร <i class="fa fa-certificate"></i></a>
            </div>
          </div>
        `;
            });
        }
        setTimeout(renderDev, 300);
    </script>
</body>

</html>
